<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>坐标定位程序</title>
  <style>
    /* ---------- 全局重置：清除浏览器默认边距，统一盒模型 ---------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* ---------- 页面整体背景：浅蓝白渐变，营造简约清爽感 ---------- */
    body {
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      background: linear-gradient(135deg, #f5f8ff 0%, #eaf1ff 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 30px 15px;
      color: #1f2d5a;
    }

    /* ---------- 主容器：白色卡片 + 圆角 + 柔和阴影 ---------- */
    .container {
      width: 100%;
      max-width: 980px;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 8px 28px rgba(30, 111, 255, 0.12);
      padding: 28px 32px;
    }

    /* ---------- 标题：蓝色加粗，居中 ---------- */
    h1 {
      text-align: center;
      color: #1e6fff;
      font-size: 26px;
      letter-spacing: 2px;
      margin-bottom: 6px;
    }

    /* ---------- 副标题/说明文字：灰色小字 ---------- */
    .subtitle {
      text-align: center;
      color: #7a8bb8;
      font-size: 13px;
      margin-bottom: 22px;
    }

    /* ---------- 输入区：两列布局（A 组 / B 组） ---------- */
    .input-panel {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    /* ---------- 单组输入卡片（A 组或 B 组） ---------- */
    .group {
      flex: 1;
      min-width: 280px;
      border: 1px solid #d6e4ff;
      border-radius: 10px;
      padding: 14px 16px;
      background: #f7faff;
    }

    /* ---------- 分组标题（直线 A / 直线 B） ---------- */
    .group h3 {
      font-size: 15px;
      color: #1e6fff;
      margin-bottom: 10px;
      border-left: 4px solid #1e6fff;
      padding-left: 8px;
    }

    /* ---------- 每一行坐标输入：标签 + 两个输入框 ---------- */
    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    /* ---------- 坐标点标签（如 A1） ---------- */
    .row label {
      width: 36px;
      font-size: 14px;
      color: #33467a;
      font-weight: bold;
    }

    /* ---------- 数字输入框：白底蓝边，圆角 ---------- */
    .row input {
      width: 90px;
      padding: 6px 8px;
      border: 1px solid #b9d2ff;
      border-radius: 6px;
      font-size: 14px;
      color: #1f2d5a;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    /* ---------- 输入框聚焦时：蓝色高亮 + 外发光 ---------- */
    .row input:focus {
      border-color: #1e6fff;
      box-shadow: 0 0 0 3px rgba(30, 111, 255, 0.15);
    }

    /* ---------- 按钮区：右对齐 ---------- */
    .btn-bar {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    /* ---------- 主按钮（计算交点）：蓝色实心 ---------- */
    .btn-primary {
      padding: 10px 28px;
      background: #1e6fff;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-primary:hover { background: #1558d6; }
    .btn-primary:active { transform: scale(0.97); }

    /* ---------- 次按钮（清空）：白底蓝边 ---------- */
    .btn-secondary {
      padding: 10px 28px;
      background: #ffffff;
      color: #1e6fff;
      border: 1px solid #1e6fff;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-secondary:hover { background: #eaf1ff; }

    /* ---------- 结果提示条：显示交点坐标或错误信息 ---------- */
    .result-tip {
      min-height: 40px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 16px;
      background: #eaf1ff;
      color: #1e6fff;
      border: 1px dashed #9cc0ff;
    }
    /* 错误状态：红色系 */
    .result-tip.error {
      background: #ffecec;
      color: #d93025;
      border-color: #ffb3ad;
    }

    /* ---------- 画布容器：居中，带浅边框 ---------- */
    .canvas-wrap {
      width: 100%;
      display: flex;
      justify-content: center;
      background: #fbfdff;
      border: 1px solid #e0eaff;
      border-radius: 10px;
      padding: 10px;
    }

    /* ---------- 画布本身：白底，细蓝边 ---------- */
    canvas {
      background: #ffffff;
      border: 1px solid #d6e4ff;
      border-radius: 6px;
      max-width: 100%;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 程序标题 -->
    <h1>我的世界末地门定位器</h1>
    <p class="subtitle">输入坐标A1,A2 确定直线A;输入坐标B1,B2 确定直线B</p>
    <p class="subtitle">自动确认交点C</p>

    <!-- 输入区：左 A 组，右 B 组 -->
    <div class="input-panel">
      <!-- 直线 A 输入组 -->
      <div class="group">
        <h3>直线A:</h3>
        <div class="row">
          <label>A1</label>
          <input type="number" id="a1x" placeholder="X" step="any" value="0" />
          <input type="number" id="a1y" placeholder="Y" step="any" value="0" />
        </div>
        <div class="row">
          <label>A2</label>
          <input type="number" id="a2x" placeholder="X" step="any" value="0" />
          <input type="number" id="a2y" placeholder="Y" step="any" value="0" />
        </div>
      </div>

      <!-- 直线 B 输入组 -->
      <div class="group">
        <h3>直线B:</h3>
        <div class="row">
          <label>B1</label>
          <input type="number" id="b1x" placeholder="X" step="any" value="0" />
          <input type="number" id="b1y" placeholder="Y" step="any" value="0" />
        </div>
        <div class="row">
          <label>B2</label>
          <input type="number" id="b2x" placeholder="X" step="any" value="0" />
          <input type="number" id="b2y" placeholder="Y" step="any" value="0" />
        </div>
      </div>
    </div>

    <!-- 操作按钮 -->
    <div class="btn-bar">
      <button class="btn-primary" onclick="calculate()">计算交点C</button>
      <button class="btn-secondary" onclick="clearAll()">清空并重置</button>
    </div>

    <!-- 结果提示区 -->
    <div class="result-tip" id="tip">请输入坐标后点击「计算交点C」</div>

    <!-- 绘图区：Canvas 坐标系 -->
    <div class="canvas-wrap">
      <canvas id="chart" width="880" height="560"></canvas>
    </div>
  </div>

  <script>
    /* ==========================================================
       一、获取 DOM 元素与画布上下文
    ========================================================== */
    // 取得画布对象与其 2D 绘图上下文
    const canvas = document.getElementById('chart');
    const ctx = canvas.getContext('2d');

    // 画布宽高（CSS 与 JS 保持一致，便于换算坐标）
    const W = canvas.width;   // 画布像素宽
    const H = canvas.height;  // 画布像素高

    // 画布内边距：给坐标轴与文字留出空间
    const PAD = 50;

    /* ==========================================================
       二、读取输入坐标
       说明：从 6 个输入框中读取数字，若为空则按 0 处理。
       返回：对象 { a1:{x,y}, a2:{x,y}, b1:{x,y}, b2:{x,y} }
    ========================================================== */
    function readPoints() {
      // 工具函数：按 id 读取数值
      const num = (id) => {
        const v = document.getElementById(id).value;
        return v === '' ? 0 : parseFloat(v);
      };
      return {
        a1: { x: num('a1x'), y: num('a1y') },
        a2: { x: num('a2x'), y: num('a2y') },
        b1: { x: num('b1x'), y: num('b1y') },
        b2: { x: num('b2x'), y: num('b2y') }
      };
    }

    /* ==========================================================
       三、计算两条直线的交点
       直线 A：过 (x1,y1) 与 (x2,y2)
       直线 B：过 (x3,y3) 与 (x4,y4)
       公式（克莱姆法则 / 直线方程联立）：
         分母 D = (x1-x2)*(y3-y4) - (y1-y2)*(x3-x4)
         若 |D| < 1e-9，两直线平行或重合，无唯一交点。
       返回：{ x, y } 或 null（平行/重合）
    ========================================================== */
    function lineIntersect(p1, p2, p3, p4) {
      const x1 = p1.x, y1 = p1.y;
      const x2 = p2.x, y2 = p2.y;
      const x3 = p3.x, y3 = p3.y;
      const x4 = p4.x, y4 = p4.y;

      // 分母：用于判断是否平行
      const D = (x1 - x2) * (y3 - y4) - (y1 - y2) * (x3 - x4);

      // 分母接近 0：平行或重合，无唯一交点
      if (Math.abs(D) < 1e-9) return null;

      // 分子部分
      const px = (x1 * y2 - y1 * x2) * (x3 - x4) - (x1 - x2) * (x3 * y4 - y3 * x4);
      const py = (x1 * y2 - y1 * x2) * (y3 - y4) - (y1 - y2) * (x3 * y4 - y3 * x4);

      return { x: px / D, y: py / D };
    }

    /* ==========================================================
       四、根据所有点的坐标范围，自动计算比例尺与原点位置
       说明：把数据坐标映射到画布像素坐标。
       返回：{ originX, originY, scaleX, scaleY }
    ========================================================== */
    function computeScale(points) {
      // 汇总所有点（含交点）以确定坐标范围
      const xs = points.map(p => p.x);
      const ys = points.map(p => p.y);

      // 计算 x、y 方向的最小/最大值
      const minX = Math.min(...xs), maxX = Math.max(...xs);
      const minY = Math.min(...ys), maxY = Math.max(...ys);

      // 防止所有点重合在一点导致除 0，给一个最小范围
      const rangeX = Math.max(maxX - minX, 10);
      const rangeY = Math.max(maxY - minY, 10);

      // 数据范围两侧各留 10% 边距
      const padX = rangeX * 0.15;
      const padY = rangeY * 0.15;

      // 实际可用绘图宽高（扣除画布内边距）
      const drawW = W - PAD * 2;
      const drawH = H - PAD * 2;

      // 计算比例尺：1 个数据单位对应多少像素
      const scaleX = drawW / (rangeX + padX * 2);
      const scaleY = drawH / (rangeY + padY * 2);

      // 取较小比例尺，保证图形完整可见且不变形（等比缩放）
      const scale = Math.min(scaleX, scaleY);

      // 计算数据原点 (0,0) 对应的画布像素位置
      // 横向：让数据中心落在画布水平中心
      const centerX = (minX + maxX) / 2;
      const centerY = (minY + maxY) / 2;
      const originX = W / 2 - centerX * scale;
      const originY = H / 2 + centerY * scale; // y 轴向下，故取反

      return { originX, originY, scale };
    }

    /* ==========================================================
       五、数据坐标 -> 画布像素坐标 转换函数
    ========================================================== */
    function toPixel(x, y, sc) {
      return {
        px: sc.originX + x * sc.scale,
        py: sc.originY - y * sc.scale  // 数学坐标系 y 向上，屏幕 y 向下
      };
    }

    /* ==========================================================
       六、在画布上绘制完整坐标系
       包含：背景、网格、坐标轴、刻度、直线、点、标签
    ========================================================== */
    function drawAll(points, c) {
      // 清空画布
      ctx.clearRect(0, 0, W, H);

      // 计算比例尺与原点
      const sc = computeScale(c ? [...points, c] : points);

      // ---------- 1) 画浅蓝网格 ----------
      ctx.strokeStyle = '#eaf1ff';
      ctx.lineWidth = 1;
      // 横向网格线（每 50 像素一条）
      for (let x = 0; x < W; x += 50) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
      }
      // 纵向网格线
      for (let y = 0; y < H; y += 50) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
      }

      // ---------- 2) 画 X、Y 坐标轴（深蓝） ----------
      ctx.strokeStyle = '#1e6fff';
      ctx.lineWidth = 1.5;
      // X 轴（水平线）
      ctx.beginPath();
      ctx.moveTo(0, sc.originY); ctx.lineTo(W, sc.originY);
      ctx.stroke();
      // Y 轴（垂直线）
      ctx.beginPath();
      ctx.moveTo(sc.originX, 0); ctx.lineTo(sc.originX, H);
      ctx.stroke();

      // 坐标轴箭头
      ctx.fillStyle = '#1e6fff';
      ctx.font = '13px Arial';
      ctx.fillText('X', W - 18, sc.originY - 6);
      ctx.fillText('Y', sc.originX + 6, 16);

      // ---------- 3) 画直线 A（蓝色实线） ----------
      drawLine(points[0], points[1], sc, '#1e6fff');
      // ---------- 4) 画直线 B（绿色实线，区分两线） ----------
      drawLine(points[2], points[3], sc, '#00b578');

      // ---------- 5) 画四个端点并标注名称 ----------
      const names = ['A1', 'A2', 'B1', 'B2'];
      points.forEach((p, i) => {
        const { px, py } = toPixel(p.x, p.y, sc);
        drawPoint(px, py, names[i], i < 2 ? '#1e6fff' : '#00b578');
      });

      // ---------- 6) 若有交点 C，画红色高亮点 ----------
      if (c) {
        const { px, py } = toPixel(c.x, c.y, sc);
        drawPoint(px, py, 'C', '#d93025', 6);
      }
    }

    /* ---------- 绘制一条直线（延伸到画布边缘） ---------- */
    function drawLine(p1, p2, sc, color) {
      // 先把两点转像素
      const a = toPixel(p1.x, p1.y, sc);
      const b = toPixel(p2.x, p2.y, sc);

      // 计算直线方向向量
      const dx = b.px - a.px;
      const dy = b.py - a.py;

      // 防止零向量（两点重合）
      if (Math.abs(dx) < 1e-9 && Math.abs(dy) < 1e-9) return;

      // 将直线沿方向两端延长，使其贯穿整个画布
      // 用足够大的系数 t，把线段拉长到画布外
      const t = 10000;
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(a.px - dx * t, a.py - dy * t);
      ctx.lineTo(a.px + dx * t, a.py + dy * t);
      ctx.stroke();
    }

    /* ---------- 绘制一个点（实心圆）并在旁边标注文字 ---------- */
    function drawPoint(px, py, name, color, r = 4) {
      ctx.beginPath();
      ctx.arc(px, py, r, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
      // 描白边，便于在网格上识别
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // 标注文字
      ctx.fillStyle = color;
      ctx.font = 'bold 13px Microsoft YaHei';
      ctx.fillText(name, px + 8, py - 8);
    }

    /* ==========================================================
       七、主流程：读取 -> 计算 -> 绘图 -> 提示
    ========================================================== */
    function calculate() {
      const { a1, a2, b1, b2 } = readPoints();
      const points = [a1, a2, b1, b2];
      const tip = document.getElementById('tip');

      // 计算交点
      const c = lineIntersect(a1, a2, b1, b2);

      if (c === null) {
        // 平行或重合
        tip.className = 'result-tip error';
        tip.textContent = '两直线平行或重合，无唯一交点';
        drawAll(points, null);
        return;
      }

      // 正常输出（保留 4 位小数）
      tip.className = 'result-tip';
      tip.innerHTML =
        'C 坐标为:<b>(' + c.x.toFixed(4) + ' , ' + c.y.toFixed(4) + ')</b>';
      drawAll(points, c);
    }

    /* ==========================================================
       八、清空并重置为示例坐标
    ========================================================== */
    function clearAll() {
      // 重置为默认示例
      document.getElementById('a1x').value = 0;
      document.getElementById('a1y').value = 0;
      document.getElementById('a2x').value = 0;
      document.getElementById('a2y').value = 0;
      document.getElementById('b1x').value = 0;
      document.getElementById('b1y').value = 0;
      document.getElementById('b2x').value = 0;
      document.getElementById('b2y').value = 0;

      // 重置提示
      const tip = document.getElementById('tip');
      tip.className = 'result-tip';
      tip.textContent = '已重置';

      // 清空画布
      ctx.clearRect(0, 0, W, H);
    }

    /* ==========================================================
       九、页面加载后自动绘制一次示例
    ========================================================== */
     window.onload = calculate;
  </script>
</body>
</html>
